name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  check:
    name: Build and Verify
    runs-on: ubuntu-latest

    # Required for Prisma/Postgres if you have integration tests,
    # but for build/lint/typecheck we just need the environment.

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install pnpm
        run: npm install -g pnpm

      - name: Get pnpm store directory
        shell: bash
        run: |
          echo "STORE_PATH=$(pnpm store path --silent)" >> $GITHUB_ENV

      - name: Setup pnpm cache
        uses: actions/cache@v4
        with:
          path: ${{ env.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-

      - name: Install Dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma Client
        run: pnpm db:generate

      - name: Run Format Check
        run: pnpm format:check

      - name: Run Linter
        run: pnpm lint

      - name: Run Type Check
        run: pnpm typecheck

      - name: Run Build
        run: pnpm build
        env:
          DATABASE_URL: "postgresql://postgres:postgres@localhost:5432/postgres"
          GEMINI_API_KEY: "dummy_gemini_api_key"
          GOOGLE_API_KEY: "dummy_google_api_key"
          BETTER_AUTH_SECRET: "dummy_better_auth_secret_1234567890abcdef"
          BETTER_AUTH_URL: "http://localhost:3000"
          GOOGLE_CLIENT_ID: "dummy_google_client_id"
          GOOGLE_CLIENT_SECRET: "dummy_google_client_secret"
          NEXT_PUBLIC_BASE_URL: "http://localhost:3000"
          RESEND_API_KEY: "re_dummy_key_12345"
          AWS_REGION: "auto"
          AWS_ENDPOINT: "https://dummy.r2.cloudflarestorage.com"
          AWS_ACCESS_KEY_ID: "dummy_access_key"
          AWS_SECRET_ACCESS_KEY: "dummy_secret_key"
          AWS_S3_BUCKET_NAME: "dummy-bucket"
